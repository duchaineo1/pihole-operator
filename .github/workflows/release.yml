name: Build and Release
on:
  push:
    branches:
      - main
    # Only changes that end up in the image or the chart cut a release;
    # ci/docs-only pushes don't.
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'dist/chart/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pihole-operator
  CHART_NAME: pihole-operator
  REGISTRY: ghcr.io
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
      
      - name: Determine next version
        id: vars
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST#v}"
          IFS='.' read -r major minor patch <<< "$VERSION"

          # Bump from the conventional-commit squash titles since the last tag:
          #   type!: / BREAKING CHANGE: -> major
          #   feat:                     -> minor
          #   anything else (fix, chore(deps), ...) -> patch
          RANGE="$LATEST..HEAD"
          [ "$LATEST" = "v0.0.0" ] && RANGE="HEAD"
          SUBJECTS=$(git log "$RANGE" --format=%s)
          BODIES=$(git log "$RANGE" --format=%b)
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$SUBJECTS" || grep -qE '^BREAKING[ -]CHANGE:' <<< "$BODIES"; then
            NEW_TAG="v$((major + 1)).0.0"
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$SUBJECTS"; then
            NEW_TAG="v${major}.$((minor + 1)).0"
          else
            NEW_TAG="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Bumping from $LATEST to $NEW_TAG"
          echo "TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:latest
      
      - name: Update Helm chart versions
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          VERSION=${TAG#v}
          
          # Update Chart.yaml
          yq eval -i ".version = \"$VERSION\"" dist/chart/Chart.yaml
          yq eval -i ".appVersion = \"$TAG\"" dist/chart/Chart.yaml
          
          # Update values.yaml with tagged image
          yq eval -i ".controllerManager.container.image.repository = \"$IMAGE_NAME\"" dist/chart/values.yaml
          yq eval -i ".controllerManager.container.image.tag = \"$TAG\"" dist/chart/values.yaml
          
          echo "Updated chart to version $VERSION with image tag $TAG"
      
      - name: Package Helm chart
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          helm package dist/chart
      
      - name: Push Helm chart to GHCR (OCI)
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          helm registry login $REGISTRY -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          helm push $CHART_NAME-${TAG#v}.tgz oci://$REGISTRY/${{ github.repository_owner }}
      
      # Tag through the Releases API, not `git push`: a pushed tag whose commits
      # touch .github/workflows is rejected for GITHUB_TOKEN, which can never
      # hold the `workflows` permission.
      - name: Create GitHub release and tag
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
