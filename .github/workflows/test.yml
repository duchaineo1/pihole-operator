name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit Tests (envtest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test
