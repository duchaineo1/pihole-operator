name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
  # release.yml runs this on the commit it is about to release
  workflow_call:

jobs:
  test:
    name: Unit Tests (envtest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test
