name: Docker Build

# e2e builds the amd64 image on every PR, but only release.yml builds the full
# multi-arch image. Build it here, without pushing, whenever something that
# shapes the image changes, so a broken arm64 build shows up on the PR instead
# of in the nightly release.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
